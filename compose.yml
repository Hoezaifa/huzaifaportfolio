services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: huzaifa-portfolio:latest
    container_name: huzaifa-portfolio
    ports:
      - "3000:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
