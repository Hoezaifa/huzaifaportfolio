services:
  portfolio-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    image: huzaifa-portfolio:dev
    container_name: huzaifa-portfolio-dev
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - VITE_WATCH_POLLING=true
    restart: "no"
